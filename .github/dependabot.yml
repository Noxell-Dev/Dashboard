version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    groups:
      minor-y-parches:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
